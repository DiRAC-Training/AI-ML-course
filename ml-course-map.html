<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machine Learning Concepts – course map</title>
<style>
:root{
  --page:#e9eef2; --ink:#14212b;
  --navy:#04263b; --navy-2:#0b3753; --purple:#6b2471; --purple-2:#57195c;
  --cyan:#00a9e0; --pink:#e0aab5; --beige:#e5d7ae; --sky:#a9cde6; --white:#fff;
  --focus:#ffd84d;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#07131c; --ink:#dce6ee; color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#07131c; --ink:#dce6ee; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page); color:var(--ink); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
.wrap{max-width:1100px; margin:0 auto; padding:12px;}
.scroller{overflow-x:auto; border-radius:6px;}
.stage{min-width:720px; background:var(--navy); border-radius:6px; overflow:hidden;}
svg.map{display:block; width:100%; height:auto; font-family:inherit;}

/* static text */
.t-title{fill:#fff; font-size:28px; font-weight:700;}
.t-hint{fill:#fff; font-size:15px;}
.t-progress{fill:var(--sky); font-size:13px;}
.t-leg{fill:#fff; font-size:14px;}
.t-link{fill:#fff; font-size:14px;}
.t-bank{fill:#fff; font-size:17px; font-weight:700;}
.t-bank-sub{fill:var(--sky); font-size:13px;}

/* nodes */
.node{cursor:pointer; transition:opacity .2s;}
.node .box{fill:var(--cyan); stroke:#fff; stroke-width:2.5; transition:fill .2s;}
.node .lbl{fill:var(--navy); font-size:16px; font-weight:700; pointer-events:none;}
.node .sub{fill:var(--navy); font-size:12.5px; pointer-events:none;}
.node:hover .box{fill:#36c0ee;}
.node:focus{outline:none;}
.node:focus-visible .box{stroke:var(--focus); stroke-width:4.5;}
.node .tick{opacity:0; transition:opacity .2s;}
.node.visited .tick{opacity:1;}

.map.has-sel .node{opacity:.28;}
.map.has-sel .node.is-sel,
.map.has-sel .node.is-req,
.map.has-sel .node.is-sug,
.map.has-sel .node.is-next{opacity:1;}
.node.is-sel .box,.node.is-sel:hover .box{fill:var(--pink);}
.node.is-req .box,.node.is-req:hover .box,
.node.is-sug .box,.node.is-sug:hover .box{fill:var(--beige);}
.node.is-sug .box{stroke-dasharray:7 5;}

/* edges */
.edge{fill:none; stroke:#fff; stroke-width:2.5; marker-end:url(#m-white); transition:opacity .2s, stroke .2s;}
.edge.sug{stroke-dasharray:8 6;}
.map.has-sel .edge{opacity:.15;}
.map.has-sel .edge.in{opacity:1; stroke:var(--beige); marker-end:url(#m-beige);}
.map.has-sel .edge.out{opacity:1; stroke:var(--sky); marker-end:url(#m-sky);}

.bank-frame{fill:rgba(255,255,255,.04); stroke:rgba(255,255,255,.4); stroke-width:1.5;}
.brand-link{cursor:pointer;}
.brand-link:hover rect{fill:#7d2c84;}
.brand-link:focus{outline:none;}
.brand-link:focus-visible rect{stroke:var(--focus); stroke-width:4;}
.bg{fill:transparent;}
.t-cc-mark{fill:#000; font-size:15px; font-weight:700; letter-spacing:-.5px;}
.t-cc{fill:#fff; font-size:13px; font-weight:700;}
.t-cc-sub{fill:#fff; font-size:10.5px;}
.cc-link:focus{outline:none;}
.cc-link:focus-visible rect{stroke:var(--focus); stroke-width:3;}
.cc-link:hover rect{fill:#1a1a1a;}

/* details panel */
dialog.panel{
  position:fixed; inset:0 0 0 auto; margin:0;
  width:min(460px,100%); height:100%; max-height:100%;
  border:0; padding:0; background:var(--navy); color:#fff;
  box-shadow:-10px 0 40px rgba(0,0,0,.35);
  font-family:inherit;
}
dialog.panel[open]{display:flex; flex-direction:column; animation:slide .25s ease-out;}
@keyframes slide{from{transform:translateX(40px); opacity:0}to{transform:none; opacity:1}}
dialog.panel::backdrop{background:rgba(2,18,30,.35);}
.ph{
  background:var(--purple); padding:18px 20px 16px;
  padding-top:calc(18px + env(safe-area-inset-top, 0px));
  display:flex; gap:12px; align-items:flex-start; justify-content:space-between;
  border-bottom:2px solid #fff;
}
.ph h2{margin:0; font-size:22px; line-height:1.25;}
.x{
  flex:none; width:36px; height:36px; border-radius:50%;
  border:2px solid #fff; background:transparent; color:#fff;
  font-size:22px; line-height:1; cursor:pointer;
}
.x:hover{background:rgba(255,255,255,.15);}
.pb{overflow-y:auto; padding:18px 20px; padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px)); flex:1;}
.sum{margin:0 0 10px; font-size:16px; line-height:1.5;}
.facts{margin:0 0 18px; font-size:14px; color:var(--sky);}
.pb h3{margin:20px 0 8px; font-size:15px; color:#fff;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:0;}
.chip{
  font:inherit; font-size:14px; font-weight:700; color:var(--navy);
  border:2px solid #fff; border-radius:10px; padding:6px 10px; cursor:pointer;
  background:var(--cyan);
}
.chip.req,.chip.sug{background:var(--beige);}
.chip.sug{border-style:dashed;}
.chip small{font-weight:400; margin-left:4px;}
.chip:hover{filter:brightness(1.07);}
.none{margin:0; font-size:14px; color:var(--sky);}
.sec{margin:16px 0 0; padding:12px 14px; background:var(--navy-2); border-radius:10px;}
.sec h4{margin:0 0 6px; font-size:14px; color:var(--sky); font-weight:700;}
.list{list-style:none; margin:0; padding:0;}
.list li{border-top:1px solid rgba(255,255,255,.12);}
.list li:first-child{border-top:0;}
.list a{
  display:flex; justify-content:space-between; gap:12px;
  padding:8px 0; color:#fff; text-decoration:none; font-size:15px; line-height:1.35;
}
.list a:hover span:first-child{text-decoration:underline;}
.list .meta{flex:none; color:var(--sky); font-size:13px;}
.list a.kc span:first-child{color:var(--beige);}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px;}
.btn{
  display:inline-block; padding:10px 16px; border-radius:10px; font-weight:700; font-size:15px;
  text-decoration:none; border:2px solid #fff; color:#fff;
}
.btn.primary{background:var(--cyan); color:var(--navy);}
.btn:hover{filter:brightness(1.08);}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important;}
}
</style>
</head>

        ["Summary", [["Autoencoders summary",3,P(2149)],["Knowledge check",0,H(2369)]]]
      ],
      exercises:[["Introduction to autoencoders",L(2370)]]
    },

    // Notebook bank domains: [title, model, link]
    { id:"astro", kind:"nb", title:"Notebook Bank: Astronomy", label:["Astronomy"],
      x:640, y:185, w:190, h:72,

    },
    { id:"phys", kind:"nb", title:"Notebook Bank: Physics", label:["Physics"],
      x:640, y:272, w:190, h:72,
      summary:"Gravitational waves, particle identification and segmentation, noise removal and ferromagnetic phases.",
      requires:["classic","usage"], suggests:["ae"],
      notebooks:[["Gravitational waves","Classification",L(2164)],["Particle types","Classification",L(2166)],["Noise removal","Autoencoder",L(2165)],["Particle segmentation","NN",L(2167)],["Ferromagnetic phase","Classification",L(2168)],["Gravitational waves","Regression",L(2169)]]
    },
    { id:"mats", kind:"nb", title:"Notebook Bank: Material Science", label:["Material Science"],
      x:640, y:359, w:190, h:72,
      summary:"Predict band gaps, detect silver, generate graphene microscopy images and classify neutron scattering. The GAN and LSTM notebooks go beyond these five courses.",
      requires:["classic","cnn"], suggests:["dnn","ae"],
      notebooks:[["Band gap","Regression",L(2170)],["Ag detection","DNN",L(2171)],["Graphene EM images","GAN",L(2172)],["Graphene EM images","VAE",L(2173)],["Neutron scattering classification","CNN",L(2174)],["Predicting beam profile","LSTM",L(2175)]]
    },
    { id:"fusion", kind:"nb", title:"Notebook Bank: Fusion", label:["Fusion"],
      x:640, y:446, w:190, h:72,
      summary:"Solve the 2D wave equation with a network, cluster plasma data and predict plasma states. The LSTM notebooks go beyond these five courses.",
      requires:["usage","cnn"], suggests:[],
      notebooks:[["2D wave equation","NN",L(2176)],["Plasma clustering","Convolutional LSTM",L(2177)],["Plasma state prediction","LSTM",L(2178)]]
    },
    { id:"health", kind:"nb", title:"Notebook Bank: Healthcare", label:["Healthcare"],
      x:640, y:533, w:190, h:72,
      summary:"Model equilibrium thermochemistry and astrochemistry with neural networks and a variational autoencoder.",
      requires:["usage"], suggests:["ae"],
      notebooks:[["Equilibrium thermochemistry","NNs",L(2179)],["Equilibrium astrochemistry","VAE",L(2180)]]
    }
  ];
  var BANK_ENROL = P(2162);

  // Arrows drawn on the map. type: required | suggested | apply
  var EDGES = [
    { from:"classic", to:"dnn",   type:"required",  d:"M170,296 H200 V196 H227" },
    { from:"dnn",     to:"usage", type:"required",  d:"M295,242 V327" },
    { from:"usage",   to:"cnn",   type:"required",  d:"M360,355 H395 V225 H427" },
    { from:"usage",   to:"ae",    type:"required",  d:"M360,395 H395 V430 H427" },
    { from:"cnn",     to:"ae",    type:"suggested", d:"M495,242 V397" },
    { from:"classic", to:"ae",    type:"suggested", d:"M140,342 V465 H427" },
    { from:"cnn",     to:"bank",  type:"apply",     d:"M560,196 H617" },
    { from:"ae",      to:"bank",  type:"apply",     d:"M560,446 H617" }
  ];
  /* ------------------------------------------------------------ */

  var SVGNS = "http://www.w3.org/2000/svg";
  var map = document.getElementById("map");
  var gEdges = document.getElementById("edges");
  var gNodes = document.getElementById("nodes");
  var panel = document.getElementById("panel");
  var progressEl = document.getElementById("progress");
  var byId = {};
  NODES.forEach(function(n){ byId[n.id] = n; });
  var COURSES = NODES.filter(function(n){ return n.kind === "course"; });
  var selected = null;
  var visited = {};
  var lastFocus = null;

  function el(name, attrs, parent){
    var e = document.createElementNS(SVGNS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function url(p){ return BASE + p; }
  function followUps(id){
    return NODES.filter(function(n){ return n.requires.indexOf(id) > -1 || n.suggests.indexOf(id) > -1; });
  }

  /* ---- draw edges ---- */
  EDGES.forEach(function(e){
    e.el = el("path", { d:e.d, "class":"edge" + (e.type === "suggested" ? " sug" : "") }, gEdges);
  });

  /* ---- draw nodes ---- */
  NODES.forEach(function(n){
    var g = el("g", { "class":"node", tabindex:"0", role:"button", "aria-haspopup":"dialog", "data-id":n.id }, gNodes);
    el("rect", { "class":"box", x:n.x, y:n.y, width:n.w, height:n.h, rx:14 }, g);
    var cx = n.x + n.w/2, cy = n.y + n.h/2;
    var lines = n.label.slice();
    var lh = 19;
    var hasSub = n.kind === "nb";
    var total = lines.length + (hasSub ? 0.85 : 0);
    var startY = cy - (total - 1) * lh / 2 + 6;
    lines.forEach(function(t, i){
      var tx = el("text", { "class":"lbl", x:cx, y:startY + i*lh, "text-anchor":"middle" }, g);
      tx.textContent = t;
    });
    if (hasSub){
      var s = el("text", { "class":"sub", x:cx, y:startY + lines.length*lh - 2, "text-anchor":"middle" }, g);
      s.textContent = n.notebooks.length + " notebooks";
    }
    var tick = el("g", { "class":"tick", transform:"translate(" + (n.x + n.w - 4) + " " + (n.y + 4) + ")", "aria-hidden":"true" }, g);
    el("circle", { r:11, fill:"#fff", stroke:"#04263b", "stroke-width":2 }, tick);
    el("path", { d:"M-5,0 L-1.5,4 L5,-4.5", fill:"none", stroke:"#04263b", "stroke-width":2.6, "stroke-linecap":"round", "stroke-linejoin":"round" }, tick);
    n.el = g;
    g.addEventListener("click", function(){ open(n.id, g); });
    g.addEventListener("keydown", function(ev){
      if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); open(n.id, g); }
    });
  });

  document.getElementById("bg").addEventListener("click", function(){ select(null); });

  /* ---- selection state ---- */
  function select(id){
    selected = id;
    map.classList.toggle("has-sel", !!id);
    var n = id ? byId[id] : null;
    var nextIds = n ? followUps(id).map(function(f){ return f.id; }) : [];
    NODES.forEach(function(m){
      var c = m.el.classList;
      c.remove("is-sel","is-req","is-sug","is-next");
      if (!n) return;
      if (m.id === id) c.add("is-sel");
      else if (n.requires.indexOf(m.id) > -1) c.add("is-req");
      else if (n.suggests.indexOf(m.id) > -1) c.add("is-sug");
      else if (nextIds.indexOf(m.id) > -1) c.add("is-next");
    });
    EDGES.forEach(function(e){
      e.el.classList.remove("in","out");
      if (!n) return;
      if (e.to === id) e.el.classList.add("in");
      else if (e.from === id) e.el.classList.add("out");
    });
    NODES.forEach(function(m){ m.el.setAttribute("aria-label", labelFor(m)); });
  }
  function labelFor(m){
    var s = m.title + (m.kind === "nb" ? ", " + m.notebooks.length + " notebooks" : "");
    if (visited[m.id]) s += ", explored";
    if (selected && selected !== m.id){
      var n = byId[selected];
      if (n.requires.indexOf(m.id) > -1) s += ", required before " + n.title;
      else if (n.suggests.indexOf(m.id) > -1) s += ", suggested before " + n.title;
    }
    return s + ". Show details.";
  }

  /* ---- panel ---- */
  function chip(id, kind){
    var m = byId[id];
    var note = kind === "req" ? "required" : kind === "sug" ? "suggested" : "";
    return '<button type="button" class="chip ' + kind + '" data-go="' + id + '">' + esc(m.title.replace("Notebook Bank: ","")) +
      (note ? '<small>' + note + '</small>' : '') + '</button>';
  }
  function relHTML(n){
    var before = n.requires.map(function(id){ return chip(id,"req"); })
      .concat(n.suggests.map(function(id){ return chip(id,"sug"); }));
    var after = followUps(n.id).map(function(f){ return chip(f.id,"next"); });
    var h = '<h3>Take first</h3>';
    h += before.length ? '<div class="chips">' + before.join("") + '</div>' : '<p class="none">Nothing. This is the starting point.</p>';
    if (n.kind === "course"){
      h += '<h3>Leads on to</h3>';
      h += after.length ? '<div class="chips">' + after.join("") + '</div>' : '<p class="none">Nothing further on this map yet.</p>';
    }
    return h;
  }
  function link(href, text, meta, cls){
    return '<li><a' + (cls ? ' class="' + cls + '"' : '') + ' href="' + esc(url(href)) + '" target="_blank" rel="noopener"><span>' + esc(text) +
      '</span><span class="meta">' + esc(meta) + '</span></a></li>';
  }
  function courseHTML(n){
    var mins = 0, kcs = 0;
    n.sections.forEach(function(s){ s[1].forEach(function(r){ if (r[1]) mins += r[1]; else kcs++; }); });
    var ex = n.exercises.length;
    var h = '<p class="sum">' + esc(n.summary) + '</p>';
    h += '<p class="facts">' + mins + ' minutes of lectures, ' + kcs + ' knowledge checks and ' + ex + ' hands-on ' + (ex === 1 ? 'exercise' : 'exercises') + '.</p>';
    h += relHTML(n);
    h += '<h3>Inside this course</h3>';
    n.sections.forEach(function(s){
      h += '<div class="sec"><h4>' + esc(s[0]) + '</h4><ul class="list">';
      s[1].forEach(function(r){ h += r[1] ? link(r[2], r[0], r[1] + " min") : link(r[2], r[0], "Quiz", "kc"); });
      h += '</ul></div>';
    });
    h += '<div class="sec"><h4>Exercises</h4><ul class="list">';
    n.exercises.forEach(function(e){ h += link(e[1], e[0], "Notebook"); });
    h += '</ul></div>';
    h += '<div class="actions"><a class="btn primary" href="' + esc(url(n.course)) + '" target="_blank" rel="noopener">Open course</a>' +
         '<a class="btn" href="' + esc(url(n.enrol)) + '" target="_blank" rel="noopener">Enrol on course</a></div>';
    return h;
  }
  function nbHTML(n){
    var h = '<p class="sum">' + esc(n.summary) + '</p>';
    h += '<p class="facts">' + n.notebooks.length + ' ready-to-run Jupyter notebooks.</p>';
    h += relHTML(n);
    h += '<div class="sec"><h4>Notebooks</h4><ul class="list">';
    n.notebooks.forEach(function(b){ h += link(b[2], b[0], b[1]); });
    h += '</ul></div>';
    h += '<div class="actions"><a class="btn primary" href="' + esc(url(C(47))) + '" target="_blank" rel="noopener">Open the Notebook Bank</a>' +
         '<a class="btn" href="' + esc(url(BANK_ENROL)) + '" target="_blank" rel="noopener">Enrol</a></div>';
    return h;
  }
  function render(id){
    var n = byId[id];
    panel.innerHTML =
      '<div class="ph"><h2 id="pt">' + esc(n.title) + '</h2>' +
      '<button type="button" class="x" data-close aria-label="Close details">×</button></div>' +
      '<div class="pb">' + (n.kind === "course" ? courseHTML(n) : nbHTML(n)) + '</div>';
  }
  function open(id, from){
    if (from) lastFocus = from;
    select(id);
    markVisited(id);
    render(id);
    if (!panel.open){
      if (typeof panel.showModal === "function") panel.showModal();
      else panel.setAttribute("open", "");
    }
    var x = panel.querySelector(".x");
    if (x) x.focus();
    var pb = panel.querySelector(".pb");
    if (pb) pb.scrollTop = 0;
  }
  function close(){
    if (typeof panel.close === "function" && panel.open) panel.close();
    else panel.removeAttribute("open");
  }
  panel.addEventListener("click", function(ev){
    if (ev.target === panel){ close(); return; }           // backdrop click
    var t = ev.target.closest ? ev.target.closest("[data-close],[data-go]") : null;
    if (!t) return;
    if (t.hasAttribute("data-close")) close();
    else { var id = t.getAttribute("data-go"); lastFocus = byId[id].el; open(id); }
  });
  panel.addEventListener("close", function(){
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  });

  /* ---- progress + SCORM 1.2 (does nothing outside an LMS) ---- */
  var scorm = (function(){
    function find(w){
      var n = 0;
      try{
        while (w && !w.API && w.parent && w.parent !== w && n < 12){ w = w.parent; n++; }
        return (w && w.API) ? w.API : null;
      }catch(e){ return null; }
    }
    var api = find(window);
    if (!api){ try{ if (window.opener) api = find(window.opener); }catch(e){} }
    var live = false;
    if (api){ try{ live = String(api.LMSInitialize("")) === "true"; }catch(e){} }
    return {
      read: function(){
        if (!live) return null;
        try{ return api.LMSGetValue("cmi.suspend_data") || null; }catch(e){ return null; }
      },
      write: function(data, done){
        if (!live) return;
        try{
          api.LMSSetValue("cmi.suspend_data", data);
          var s = api.LMSGetValue("cmi.core.lesson_status");
          if (done) api.LMSSetValue("cmi.core.lesson_status", "completed");
          else if (s === "not attempted" || s === "" || s === "unknown") api.LMSSetValue("cmi.core.lesson_status", "incomplete");
          api.LMSCommit("");
        }catch(e){}
      },
      finish: function(){
        if (!live) return;
        try{ api.LMSFinish(""); }catch(e){}
        live = false;
      }
    };
  })();

  function coursesDone(){ return COURSES.filter(function(c){ return visited[c.id]; }).length; }
  function updateProgress(){
    var d = coursesDone();
    progressEl.textContent = d === COURSES.length ? "All 5 courses explored" : d + " of " + COURSES.length + " courses explored";
    NODES.forEach(function(m){ m.el.classList.toggle("visited", !!visited[m.id]); });
  }
  function markVisited(id){
    if (visited[id]) return;
    visited[id] = true;
    updateProgress();
    scorm.write(JSON.stringify(Object.keys(visited)), coursesDone() === COURSES.length);
  }

  try{
    var saved = scorm.read();
    if (saved) JSON.parse(saved).forEach(function(id){ if (byId[id]) visited[id] = true; });
  }catch(e){}
  updateProgress();
  scorm.write(JSON.stringify(Object.keys(visited)), coursesDone() === COURSES.length);
  select(null);
  window.addEventListener("pagehide", scorm.finish);
  window.addEventListener("beforeunload", scorm.finish);
})();
</script>
